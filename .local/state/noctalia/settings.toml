[audio]
enable_sounds = true

[backdrop]
enabled = true

[bar]
order = [ "vertical", "horizontal" ]

    [bar.horizontal]
    center = [ "clock", "media" ]
    enabled = false
    end = [ "clipboard", "network", "bluetooth", "brightness", "battery", "session" ]
    margin_edge = 0
    margin_ends = 0
    radius = 0
    start = [ "launcher", "workspaces" ]

        [bar.horizontal.monitor.HDMI-A-1]
        enabled = true

    [bar.vertical]
    background_opacity = 0.89999997615814209
    center = [ "weather", "spacer", "clock", "media" ]
    enabled = false
    end = [ "tray", "battery", "keyboard_layout", "volume" ]
    margin_edge = 3
    margin_ends = 240
    position = "left"
    radius = 18
    start = [ "notifications", "workspaces" ]

        [bar.vertical.monitor.DP-1]
        enabled = true

[brightness]
enable_ddcutil = true

[calendar]
enabled = true

    [calendar.account.orgmode]
    name = "OrgMode"
    provider = "custom"
    server_url = "http://localhost:5232/edpyt/org/"
    type = "caldav"
    username = "edpyt"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "mic_mute"

