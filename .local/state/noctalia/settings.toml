[nightlight]
force = true

[osd]
keyboard_layout = false
position = "bottom_center"

[shell]
avatar_path = "/home/edpyt/Downloads/tadc-bubble.gif"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = false

    [shell.mpris]
    blacklist = [ "mpv" ]

    [shell.panel]
    launcher_categories = false
    session_placement = "centered"
    transparency_mode = "soft"
    wallpaper_placement = "centered"

    [[shell.session.actions]]
    action = "command"
    command = "noctalia msg session lock-and-suspend"
    enabled = true
    glyph = "suspend"
    label = "Sleep"
    shortcut = "s"
    variant = "default"

    [[shell.session.actions]]
    action = "lock"
    enabled = true
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    enabled = true
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    enabled = true
    shortcut = "q"
    variant = "secondary"

[theme]
builtin = "Rosé Pine"
community_palette = "Rose Pine Moon"
custom_palette = "ADW"
mode = "dark"
source = "community"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [ "tauon", "zen-browser", "neovim", "discord", "papirus-icons" ]

[wallpaper]
directory = "/home/edpyt/wallpapers"

    [wallpaper.default]
    path = "/home/edpyt/wallpapers/wallhaven-k875o6_1920x1080.png"

    [wallpaper.last]
    path = "/home/edpyt/wallpapers/wallhaven-w5m326_1920x1080.png"

    [wallpaper.monitors.DP-1]
    path = "/home/edpyt/wallpapers/wallhaven-w5m326_1920x1080.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/edpyt/wallpapers/wallhaven-yqv7xg_1080x1920.png"

    [[wallpaper.favorite]]
    community_palette = "Catppuccin Lavender"
    palette_source = "community"
    path = "/home/edpyt/wallpapers/wallhaven-e8ed5w_1920x1080.png"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    community_palette = "Catppuccin Lavender"
    palette_source = "community"
    path = "/home/edpyt/wallpapers/wallhaven-k875o6_1920x1080.png"
    theme_mode = "dark"

[widget.clock]
vertical_format = "{:%H\\n%M\\n-\\n%d\\n%m}"

[widget.keyboard_layout]
display = "short"
hide_label = false

[widget.media]
capsule = false

[widget.spacer]
capsule = false

[widget.volume]
capsule = false
device = "output"
show_label = true

[widget.workspaces]
capsule = false
display = "none"
hide_when_empty = false