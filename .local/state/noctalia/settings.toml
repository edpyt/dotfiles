[nightlight]
force = true

[osd]
keyboard_layout = false
position = "bottom_center"

    [osd.kinds]
    keyboard_layout = false
    media = false

[plugin_settings."noctalia/kaomoji"]
notify_on_copy = false

[plugin_settings."noctalia/mpvpaper"]
hardware_decode = false
picker_placement = "floating"
picker_position = "center"
video_directory = "~/wallpapers/"

[plugin_settings."noctalia/screen_recorder"]
directory = ""

[plugin_settings."noctalia/translator"]
target_lang = "en"

[plugin_settings."noctalia/wallhaven"]
download_dir = "~/wallpapers/"

[plugins]
enabled = [ "noctalia/screen_recorder", "noctalia/translator", "noctalia/wallhaven", "noctalia/kaomoji", "noctalia/mpvpaper" ]

[shell]
avatar_path = "/home/edpyt/Downloads/320x320.jpg"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
telemetry_enabled = false

    [shell.mpris]
    blacklist = [ "mpv", "Blanket" ]

    [shell.panel]
    control_center_position = "center"
    launcher_categories = false
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "soft"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [[shell.session.actions]]
    action = "command"
    command = "noctalia msg session lock-and-suspend"
    countdown_seconds = 0.0
    enabled = true
    glyph = "suspend"
    label = "Спать"
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "secondary"

[system.monitor]
gpu_poll_seconds = 5

[theme]
builtin = "Eldritch"
community_palette = "Tokyo Night Moon"
custom_palette = "ADW"
source = "community"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [ "tauon", "zen-browser", "neovim", "discord", "papirus-icons", "steam" ]

[wallpaper]
directory = "/home/edpyt/wallpapers"

    [wallpaper.default]
    path = "/home/edpyt/wallpapers/wallhaven-qrm3dl.jpg"

    [wallpaper.last]
    path = "/home/edpyt/wallpapers/wallhaven-qrm3dl.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/edpyt/wallpapers/wallhaven-qrm3dl.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/edpyt/wallpapers/wallhaven-qrm3dl.jpg"

[widget.audio_visualizer]
mirrored = false

[widget.cat]
audio_spectrum = true
rave_mode = true
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.clock]
vertical_format = "{:\\n%H\\n%M\\n-\\n%d\\n%m}"

[widget.keyboard_layout]
display = "short"
hide_label = false

[widget.media]
capsule = false
hide_when_no_media = true

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

[widget.mpvpaper_2]
type = "noctalia/mpvpaper:mpvpaper"

[widget.notifications]
hide_when_no_unread = true

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.volume]
capsule = false
device = "output"
show_label = true

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.workspaces]
capsule = false
display = "none"
empty_color = "on_surface"
hide_when_empty = false
occupied_color = "on_surface_variant"