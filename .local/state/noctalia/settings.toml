[audio]
enable_sounds = true

[backdrop]
enabled = true

[bar]
order = [ "vertical", "horizontal" ]

    [bar.horizontal]
    center = [ "mpvpaper_2", "clock", "recorder" ]
    enabled = false
    end = [ "clipboard", "network", "bluetooth", "brightness", "battery", "session" ]
    layer = "overlay"
    margin_edge = 0
    margin_ends = 0
    radius = 0
    start = [ "launcher", "workspaces", "wallhaven" ]

        [bar.horizontal.monitor.HDMI-A-1]
        enabled = true

    [bar.vertical]
    center = [ "weather", "spacer", "clock", "media" ]
    enabled = false
    end = [ "tray", "battery", "keyboard_layout", "volume" ]
    margin_edge = 0
    margin_ends = 220
    position = "left"
    radius = 18
    radius_bottom_left = 0
    radius_top_left = 0
    start = [ "notifications", "workspaces" ]

        [bar.vertical.monitor.DP-1]
        enabled = true

[brightness]
enable_ddcutil = true

[calendar]
enabled = true

    [calendar.account.orgmode]
    color = "tertiary"
    name = "OrgMode"
    provider = "custom"
    server_url = "http://localhost:5232/edpyt/org/"
    type = "caldav"
    username = "edpyt"

